name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cynes-reporting-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  publish:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: image
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.REPORTING_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/production
          chmod 600 ~/.ssh/production
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts
      - name: Upload deployment configuration
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          tar -czf /tmp/cynes-reporting-deploy.tgz deploy
          scp -i ~/.ssh/production /tmp/cynes-reporting-deploy.tgz "$PROD_USER@$PROD_HOST:/tmp/cynes-reporting-deploy.tgz"
      - name: Deploy application
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/production "$PROD_USER@$PROD_HOST" "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          app_dir=/opt/apps/cynes-reporting
          install -d "$app_dir"
          tar -xzf /tmp/cynes-reporting-deploy.tgz -C "$app_dir"
          rm -f /tmp/cynes-reporting-deploy.tgz
          cd "$app_dir/deploy"
          test -f .env.production
          export IMAGE_TAG
          docker compose --env-file .env.production -f compose.production.yml pull reporting
          docker compose --env-file .env.production -f compose.production.yml up -d --remove-orphans reporting
          for attempt in $(seq 1 20); do
            if docker compose --env-file .env.production -f compose.production.yml exec -T reporting node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker compose --env-file .env.production -f compose.production.yml logs --tail=100 reporting
              exit 1
            fi
            sleep 3
          done
          docker image prune -f
          REMOTE
